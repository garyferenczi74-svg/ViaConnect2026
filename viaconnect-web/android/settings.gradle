include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'

// See android/build.gradle. Kotlin 1.8.20 cannot parse JVM target 21.
// This does not edit node_modules or package.json. 2.2.20 is already the
// Kotlin Gradle plugin version resolved by @capacitor/camera 8.2.5.
gradle.beforeProject { p ->
    if (p.name != 'capacitor-health-connect') {
        return
    }
    p.buildscript.configurations.classpath.resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin'
                && details.requested.name == 'kotlin-gradle-plugin'
                && details.requested.version == '1.8.20') {
            details.useVersion '2.2.20'
            details.because 'Kotlin 1.8.20 cannot parse JVM target 21. Align with the camera plugin Kotlin version already used in this project.'
        }
    }
}
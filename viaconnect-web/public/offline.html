<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ViaConnect is offline</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0B1120;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: 100%;
      max-width: 28rem;
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 1.5rem;
      font-weight: 650;
    }
    p {
      margin: 0 0 24px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 1rem;
      line-height: 1.5;
    }
    button {
      min-height: 44px;
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: #2DA5A0;
      color: #0B1120;
      font-size: 1rem;
      font-weight: 650;
      cursor: pointer;
    }
    button:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 3px;
    }
    @media (min-width: 640px) {
      button { width: auto; padding: 0 28px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>ViaConnect cannot reach the server</h1>
    <p>Check your connection, then try again. Your account stays on the server. Nothing new is saved on this screen.</p>
    <button type="button" id="retry">Try again</button>
  </main>
  <script>
    document.getElementById("retry").addEventListener("click", function () {
      window.location.replace("https://viaconnectapp.com/");
    });
  </script>
</body>
</html>

name: Schema Drift Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Prompt 219k: cancel superseded runs so one red window is not a flood
concurrency:
  group: schema-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-drift:
    name: Schema Drift Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viaconnect-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scan code refs against schema snapshot
        # Zero-dependency scanner; no npm install needed. Fails only on
        # table/rpc/bucket references absent from both the committed
        # snapshot and the reviewed baseline. Editing the baseline
        # requires a PR diff that reviewers see.
        run: node scripts/schema/scan-code-refs.mjs --baseline scripts/schema/drift-baseline.json --snapshot docs/integrity/snapshot

  migration-parity:
    name: Migration Parity Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viaconnect-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check repo migrations against applied manifest
        # Zero-dependency checker; no npm install needed. Fails when a
        # post-baseline repo migration is absent from the applied manifest
        # (outside the 7 day sign-off grace window) or when a manifest
        # entry has no repo file. Apply rule: docs/integrity/apply-procedure.md.
        run: node scripts/schema/check-migration-parity.mjs --manifest docs/integrity/snapshot/applied-manifest.json --migrations supabase/migrations

  # Prompt 219k: one ops-surface ping per failed main run (coalesced server-side).
  # Note: secrets cannot be used in job if: conditions; check inside the step.
  notify-ops-on-failure:
    name: Notify ACC on main failure
    if: failure() && github.ref == 'refs/heads/main'
    needs: [schema-drift, migration-parity]
    runs-on: ubuntu-latest
    steps:
      - name: POST ci_failure event
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET not set in GitHub Actions secrets; skip ACC notify"
            exit 0
          fi
          curl -sS -X POST "https://www.viaconnectapp.com/api/cron/ci-failure" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"workflow\":\"Schema Drift Gate\",\"runId\":\"${{ github.run_id }}\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"headSha\":\"${{ github.sha }}\",\"conclusion\":\"failure\"}"
